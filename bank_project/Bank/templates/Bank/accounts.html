{% extends 'Bank/base.html' %}
{% block content %}
<h2>Банківські рахунки</h2>
{% for account in accounts %}
<div class="form-box">
    <h3>Рахунок № {{ account.account_number }}</h3>
    <p>Клієнт: {{ account.client }}</p>
    <p>Баланс: {{ account.balance }} {{ account.currency }}</p>
</div>
{% empty %}
<p>Рахунків поки немає.</p>
{% endfor %}
{% endblock %}
